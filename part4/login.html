<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB - Login</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body>
  <header>
    <a href="index.html"><img src="images/logo.png" alt="HBnB logo" class="logo" width="160" height="48"></a>
    <nav aria-label="Main navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="login.html" class="login-button" id="login-link">Login</a>
      <button type="button" class="logout-button" id="logout-button" hidden>Logout</button>
    </nav>
  </header>

  <main>
    <section class="login-section">
      <h1>Login</h1>
      <form id="login-form" class="form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="form-button">Login</button>
        <p id="login-error" class="error-message" role="alert" hidden></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 HBnB Evolution. All rights reserved.</p>
  </footer>
</body>
</html>
